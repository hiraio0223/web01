<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webサイト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #f5f5f5;
      padding-bottom: 90px;
    }

    header {
      background-color: #440000;
      color: white;
      text-align: center;
      padding: 24px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    section {
      background-color: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    section h2 {
      margin-top: 0;
      color: 	#cc0000;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #222;
      color: white;
      text-align: center;
      padding: 15px;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      color440000: ;
      margin: 0 8px;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>シンプルWebサイト</h1>
  </header>

  <main>
    <section>
      <h3>このサイトについて</h3>
      <p>
        こちらはHTMLとCSSだけで作成したシンプルなWebサイトです。
        見やすく、シンプルなデザインを目指しています。
      </p>
    </section>

    <section>
      <h3>サービス内容</h3>
      <img src="https://github.com/hiraio0223/web01/blob/main/cupcake.jpg?raw=true" alt="サンプル">
      <p>
        Webサイト制作やデザインなど、さまざまなサービスを提供しています。
      </p>
    </section>
  </main>

  <footer>
    <p>お問い合わせ：info@example.com</p>
    <p>
      <a href="https://twitter.com/" target="_blank">X</a>
      <a href="https://www.instagram.com/" target="_blank">Instagram</a>
      <a href="https://www.facebook.com/" target="_blank">Facebook</a>
    </p>
  </footer>

</body>
</html>
